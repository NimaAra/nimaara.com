services:
  jekyll:
    image: ruby:3.3
    working_dir: /site
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
      - jekyll-gems:/usr/local/bundle
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --livereload --drafts --future"

volumes:
  jekyll-gems:
